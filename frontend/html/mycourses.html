<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Courses</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f6fb;
}

header{
    background:#1f3c88;
    color:white;
    text-align:center;
    padding:20px;
}

h1{
    font-size:32px;
}

.container{
    width:90%;
    margin:40px auto;
}

.course-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.course-card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:0.3s;
}

.course-card:hover{
    transform:translateY(-5px);
}

.course-card h3{
    color:#1f3c88;
    margin-bottom:10px;
}

.course-card p{
    color:#666;
}

.back-btn{
    display:inline-block;
    margin-bottom:20px;
    padding:10px 20px;
    background:#1f3c88;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.back-btn:hover{
    background:#16306d;
}

.empty{
    text-align:center;
    font-size:20px;
    color:#777;
    margin-top:50px;
}

</style>

</head>
<body>

<header>
    <h1>📚 My Courses</h1>
</header>

<div class="container">

    <a href="student-dashboard.html" class="back-btn">
        ⬅ Back to Dashboard
    </a>

    <div id="courseList" class="course-grid">

    </div>

</div>
<script src="mycourses.js"></script>

</body>
</html>
